<head>
    <meta charset="UTF-8">

    <title>Mapa Indígena de Bolivia</title>
    <style>
        :root { 
            --accent-gold: #FFB81C; 
            --dark-bg: #121212; 
        }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background-color: var(--dark-bg); 
            color: #fff; 
            margin: 0; 
            padding: 10px 20px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Encabezado reducido para dar prioridad al mapa */
        header { 
            padding: 10px 0; 
            border-bottom: 2px solid var(--accent-gold); 
            margin-bottom: 15px; 
            width: 100%; 
            max-width: 1000px;
            text-align: center;
        }

        h1 { 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin: 0; 
            font-size: 22px;
        }

        p.instrucciones {
            color: #aaaaaa;
            margin: 5px 0 0 0;
            font-size: 13px;
            font-style: italic;
        }

        .map-container {
            position: relative;
            max-width: 100%;
            display: flex;
            justify-content: center;
        }

        /* Mapa elástico adaptado al nuevo espacio */
        img {
            max-width: 100%;
            max-height: calc(100vh - 120px);
            width: auto;
            height: auto;
            display: block;
            cursor: pointer;
            border-radius: 8px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.8);
            object-fit: contain;
        }

        .autor-texto {
            color: #888888;
            font-size: 12px;
            margin-top: 10px;
            font-style: italic;
            text-align: center;
            width: 100%;
        }

        /* Tooltip con diseño del portal */
        #tooltip {
            position: absolute;
            background-color: #1a1a1a;
            color: #ffffff;
            padding: 10px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 10;
            box-shadow: 0px 5px 15px rgba(0,0,0,0.9);
            border: 1px solid var(--accent-gold);
        }

        #tooltip img {
            max-width: 150px;
            height: auto;
            border-radius: 4px;
            margin-bottom: 8px;
            display: none;
        }
    </style>
</head>

    <script>
        const areas = document.querySelectorAll('area');
        const tooltip = document.getElementById('tooltip');
        const tooltipImg = document.getElementById('tooltip-img');
        const tooltipText = document.getElementById('tooltip-text');
        const mapContainer = document.querySelector('.map-container');
        let clickTimeout = null;

        areas.forEach(area => {
            area.addEventListener('mousemove', (e) => {
                const rect = mapContainer.getBoundingClientRect();
                const img = document.getElementById('mapa_img');
                const imgRect = img.getBoundingClientRect();
                
                const x = e.clientX - imgRect.left;
                const y = e.clientY - imgRect.top;

                const name = area.getAttribute('data-name');
                const imageSrc = area.getAttribute('data-image');

                tooltipText.textContent = name;
                if (imageSrc && imageSrc !== 'null' && imageSrc !== '') {
                    tooltipImg.src = imageSrc;
                    tooltipImg.style.display = 'block';
                } else {
                    tooltipImg.style.display = 'none';
                }

                tooltip.style.left = (e.clientX - rect.left + 20) + 'px';
                tooltip.style.top = (e.clientY - rect.top + 20) + 'px';
                tooltip.style.opacity = '1';
            });

            area.addEventListener('mouseout', () => {
                tooltip.style.opacity = '0';
            });

            area.addEventListener('click', (e) => {
                e.preventDefault(); 
                
                if (clickTimeout !== null) {
                    clearTimeout(clickTimeout);
                    clickTimeout = null;
                    const url = area.getAttribute('data-url');
                    if (url) {
                        window.open(url, '_self'); 
                    }
                } else {
                    clickTimeout = setTimeout(() => {
                        clickTimeout = null;
                    }, 300); 
                }
            });
        });

        function resizeMap() {
            const img = document.getElementById('mapa_img');
            const map = document.getElementById('mapa_indigena');
            
            const originalMapWidth = 482; 

            if (!img || !img.complete || img.clientWidth === 0) {
                setTimeout(resizeMap, 100);
                return;
            }

            const currentWidth = img.clientWidth;
            const ratio = currentWidth / originalMapWidth;

            const areasArr = map.getElementsByTagName('area');
            for (let i = 0; i < areasArr.length; i++) {
                const area = areasArr[i];
                if (!area.dataset.originalCoords) {
                    area.dataset.originalCoords = area.getAttribute('coords');
                }
                const originalCoords = area.dataset.originalCoords.split(',').map(Number);
                
                const newCoords = originalCoords.map(coord => Math.round(coord * ratio));
                area.setAttribute('coords', newCoords.join(','));
            }
        }

        window.addEventListener('resize', resizeMap);
        window.addEventListener('load', resizeMap);
    </script>
